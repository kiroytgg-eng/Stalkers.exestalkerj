name: Build mod
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Descomprimir
        run: unzip -o stalkers_exe_1.2.1*.zip -d src_zip
      - name: Compilar
        working-directory: src_zip/stalkers_exe_1.2.1
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stalkers_exe-1.2.1
          path: src_zip/stalkers_exe_1.2.1/build/libs/*.jar
